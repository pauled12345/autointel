name: keepalive

# Keeps the Render web service awake and Neon compute from auto-suspending.
# Render free spins down after ~15 min idle; Neon free suspends after ~5 min.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Warm Render + Neon
        run: |
          curl -fsS --max-time 60 https://autointel-api-nh0a.onrender.com/health
          curl -fsS --max-time 60 https://autointel-api-nh0a.onrender.com/health/db
