# Render Blueprint for the AutoIntel FastAPI backend.
# Create via: Render Dashboard -> New -> Blueprint -> select this repo.
# The backend lives in `backend/`; the database is Neon (serverless Postgres).
services:
  - type: web
    name: autointel-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Paste the Neon connection string here in the Render dashboard
      # (Project -> Connect -> connection string, keep ?sslmode=require).
      - key: DATABASE_URL
        sync: false
      # LLM key used for fault-code explanations (OpenAI or Gemini).
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      # Sign JWTs with a strong secret; Render generates one.
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.7
